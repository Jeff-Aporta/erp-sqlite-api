# nginx: front estático + API en el mismo origen (sin CORS). Lo copia deploy/install.sh a
# /etc/nginx/snippets/erp-sqlite.conf; se incluye dentro del `server { listen 9443 ssl; … }`:
#
#     include snippets/erp-sqlite.conf;

location /api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    # SOBRESCRIBIR (no $proxy_add_x_forwarded_for): DER toma el primer salto como IP del cliente
    # para el bloqueo por fuerza bruta y la auditoría; si se anexa, el cliente podría falsearla.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
}

# Front (repo erp-sqlite/front): index.html + dist/cdn + view + assets.
location / {
    root /opt/erp-sqlite/front;
    try_files $uri $uri/ /index.html;
    location ~ ^/(src|tests|scripts|specs|node_modules)/ { return 404; }
    location ~ /\. { return 404; }
}
